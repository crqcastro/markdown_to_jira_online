<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown ↔ Jira Converter</title>
  <style>
    /* ── Variables ───────────────────────────────────── */
    :root {
      --bg:            #f0f2f5;
      --surface:       #ffffff;
      --surface2:      #f8f9fa;
      --border:        #d0d7de;
      --text:          #1f2328;
      --text-muted:    #656d76;
      --accent:        #0052CC;
      --accent-hover:  #003E9E;
      --accent-fg:     #ffffff;
      --accent-soft:   #ddeeff;
      --btn-bg:        #f6f8fa;
      --btn-hover:     #eaeef2;
      --success:       #1a7f37;
      --shadow-sm:     0 1px 3px rgba(0,0,0,.08);
      --shadow-md:     0 4px 12px rgba(0,0,0,.1);
      --radius:        8px;
      --transition:    .15s ease;
    }
    [data-theme="dark"] {
      --bg:            #0d1117;
      --surface:       #161b22;
      --surface2:      #21262d;
      --border:        #30363d;
      --text:          #e6edf3;
      --text-muted:    #8b949e;
      --accent:        #4c9aff;
      --accent-hover:  #79b8ff;
      --accent-fg:     #0d1117;
      --accent-soft:   #1c3553;
      --btn-bg:        #21262d;
      --btn-hover:     #30363d;
      --shadow-sm:     0 1px 3px rgba(0,0,0,.3);
      --shadow-md:     0 4px 12px rgba(0,0,0,.4);
    }

    /* ── Reset ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Header ──────────────────────────────────────── */
    header {
      background: var(--accent);
      color: var(--accent-fg);
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-md);
      flex-shrink: 0;
      z-index: 10;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 32px; height: 32px;
      background: rgba(255,255,255,.18);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      font-weight: 700;
    }
    .logo-text h1 {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .logo-text small {
      font-size: .72rem;
      opacity: .8;
    }
    .header-actions { display: flex; gap: 6px; }

    /* ── Settings panel ──────────────────────────────── */
    #settings-panel {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
      max-height: 0;
      transition: max-height .3s ease, padding .3s ease;
    }
    #settings-panel.open {
      max-height: 400px;
      padding: 16px 20px;
    }
    #settings-panel h2 {
      font-size: .8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px 24px;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .setting-row label {
      font-size: .85rem;
      color: var(--text);
      flex: 1;
    }
    .setting-row input[type="checkbox"] {
      width: 16px; height: 16px;
      cursor: pointer;
      accent-color: var(--accent);
    }
    .setting-row input[type="number"] {
      width: 56px;
      padding: 3px 7px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface2);
      color: var(--text);
      font-size: .85rem;
      text-align: center;
    }

    /* ── Toolbar ─────────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .toolbar-sep {
      width: 1px;
      height: 22px;
      background: var(--border);
      margin: 0 2px;
    }
    .auto-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      font-size: .83rem;
      color: var(--text-muted);
      cursor: pointer;
    }
    .auto-row input { accent-color: var(--accent); cursor: pointer; }

    /* ── Buttons ─────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--btn-bg);
      color: var(--text);
      font-size: .83rem;
      font-weight: 500;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
      white-space: nowrap;
      line-height: 1.4;
    }
    .btn:hover { background: var(--btn-hover); }
    .btn:active { opacity: .8; }
    .btn.primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: transparent;
    }
    .btn.primary:hover { background: var(--accent-hover); }
    .btn.sm { padding: 3px 9px; font-size: .78rem; }
    .btn.ghost {
      background: rgba(255,255,255,.18);
      border-color: rgba(255,255,255,.25);
      color: #fff;
    }
    .btn.ghost:hover { background: rgba(255,255,255,.28); }
    .btn.icon-only { padding: 5px 7px; }

    /* ── Main layout ─────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px 20px 16px;
      gap: 14px;
      min-height: 0;
    }
    .editors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      flex: 1;
      min-height: 0;
    }

    /* ── Editor panel ────────────────────────────────── */
    .panel {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      min-height: 420px;
    }
    .panel.focus-in { border-color: var(--accent); }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }
    .panel-title {
      font-size: .83rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: .68rem;
      padding: 1px 6px;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .panel-actions { display: flex; gap: 4px; }
    textarea {
      flex: 1;
      width: 100%;
      padding: 12px 14px;
      font-family: 'Fira Code', 'Cascadia Code', 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: .82rem;
      line-height: 1.65;
      border: none;
      outline: none;
      resize: none;
      background: var(--surface);
      color: var(--text);
      min-height: 360px;
    }
    textarea::placeholder { color: var(--text-muted); }
    .panel-footer {
      padding: 5px 12px;
      background: var(--surface2);
      border-top: 1px solid var(--border);
      font-size: .72rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* ── Toast ───────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #24292e;
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: .83rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      z-index: 999;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Footer ──────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 10px;
      font-size: .75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 700px) {
      .editors { grid-template-columns: 1fr; }
      .toolbar { padding: 8px 12px; }
      main { padding: 10px 12px 12px; }
      header { padding: 0 12px; }
    }
  </style>
</head>
<body>

<!-- ══ HEADER ══════════════════════════════════════════ -->
<header>
  <div class="logo">
    <div class="logo-icon">⇄</div>
    <div class="logo-text">
      <h1>Markdown ↔ Jira</h1>
      <small>Conversor de formatação</small>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn ghost" id="settings-toggle" title="Configurações">
      ⚙ Configurações
    </button>
    <button class="btn ghost icon-only" id="theme-toggle" title="Alternar tema" aria-label="Alternar tema">🌙</button>
  </div>
</header>

<!-- ══ SETTINGS ════════════════════════════════════════ -->
<div id="settings-panel" role="region" aria-label="Configurações">
  <h2>Opções de conversão</h2>
  <div class="settings-grid">
    <div class="setting-row">
      <label for="s-spaces">Espaços por nível de indentação</label>
      <input type="number" id="s-spaces" value="2" min="1" max="8" />
    </div>
    <div class="setting-row">
      <label for="s-tables">Converter tabelas</label>
      <input type="checkbox" id="s-tables" checked />
    </div>
    <div class="setting-row">
      <label for="s-images">Converter imagens</label>
      <input type="checkbox" id="s-images" checked />
    </div>
    <div class="setting-row">
      <label for="s-blockquotes">Converter citações (blockquotes)</label>
      <input type="checkbox" id="s-blockquotes" checked />
    </div>
    <div class="setting-row">
      <label for="s-codelang">Preservar linguagem dos blocos de código</label>
      <input type="checkbox" id="s-codelang" checked />
    </div>
    <div class="setting-row">
      <label for="s-multiline">Citações multilinha com <code>{quote}</code></label>
      <input type="checkbox" id="s-multiline" checked />
    </div>
  </div>
</div>

<!-- ══ TOOLBAR ═════════════════════════════════════════ -->
<div class="toolbar">
  <button class="btn primary" id="btn-md2jira">Markdown → Jira</button>
  <button class="btn primary" id="btn-jira2md">Jira → Markdown</button>
  <div class="toolbar-sep"></div>
  <button class="btn" id="btn-swap" title="Trocar conteúdo dos painéis">⇅ Trocar</button>
  <button class="btn" id="btn-example">📋 Exemplo</button>
  <button class="btn" id="btn-clear">🗑 Limpar</button>
  <label class="auto-row" title="Converte automaticamente enquanto você digita">
    <input type="checkbox" id="auto-convert" />
    Converter automaticamente
  </label>
</div>

<!-- ══ EDITORS ═════════════════════════════════════════ -->
<main>
  <div class="editors">
    <!-- Markdown panel -->
    <div class="panel" id="panel-md">
      <div class="panel-header">
        <div class="panel-title">
          <span>Markdown</span>
          <span class="badge">entrada</span>
        </div>
        <div class="panel-actions">
          <button class="btn sm" id="btn-copy-md">📋 Copiar</button>
          <button class="btn sm" id="btn-clear-md">✕</button>
        </div>
      </div>
      <textarea
        id="md-input"
        spellcheck="false"
        placeholder="Cole ou digite seu Markdown aqui...&#10;&#10;Use os botões acima para converter."
      ></textarea>
      <div class="panel-footer">
        <span id="md-stats">0 caracteres</span>
        <span id="md-lines">0 linhas</span>
      </div>
    </div>

    <!-- Jira panel -->
    <div class="panel" id="panel-jira">
      <div class="panel-header">
        <div class="panel-title">
          <span>Jira Wiki Markup</span>
          <span class="badge">saída</span>
        </div>
        <div class="panel-actions">
          <button class="btn sm" id="btn-copy-jira">📋 Copiar</button>
          <button class="btn sm" id="btn-clear-jira">✕</button>
        </div>
      </div>
      <textarea
        id="jira-input"
        spellcheck="false"
        placeholder="Cole ou digite seu Jira markup aqui...&#10;&#10;Use os botões acima para converter."
      ></textarea>
      <div class="panel-footer">
        <span id="jira-stats">0 caracteres</span>
        <span id="jira-lines">0 linhas</span>
      </div>
    </div>
  </div>
</main>

<footer>

<!-- ══════════════════════════════════════════════════
     CONVERSION LOGIC  (ported 1-to-1 from Python)
══════════════════════════════════════════════════ -->
<script>
'use strict';

// ── Utilities ───────────────────────────────────────

function normalizeNewlines(text) {
  return text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
}

function indentLevelFromSpaces(count, perIndent) {
  perIndent = Math.max(1, perIndent);
  return Math.max(1, Math.floor(count / perIndent) + 1);
}

/**
 * Replace all matches of `pattern` (must have /g flag) with placeholder
 * tokens, pushing the formatted replacement into `stash`.
 * Returns [newText, stash].
 */
function protectSegments(text, pattern, formatter) {
  const stash = [];
  const result = text.replace(pattern, (...args) => {
    const token = `\x02PROT${stash.length}\x03`;
    stash.push(formatter(...args));
    return token;
  });
  return [result, stash];
}

function restoreSegments(text, stash) {
  for (let i = 0; i < stash.length; i++) {
    // Use split/join to avoid '$' interpretation in replacement strings
    text = text.split(`\x02PROT${i}\x03`).join(stash[i]);
  }
  return text;
}

// ── Markdown → Jira ─────────────────────────────────

function mdToJira(text, opts) {
  opts = Object.assign({
    spaces_per_indent:      2,
    convert_tables:         true,
    convert_images:         true,
    convert_blockquotes:    true,
    preserve_code_language: true,
    blockquote_multiline:   true,
  }, opts);

  text = normalizeNewlines(text);
  const spi = Math.max(1, parseInt(opts.spaces_per_indent) || 2);
  const stash = [];

  // 1. Protect fenced code blocks
  let [t1, cb] = protectSegments(
    text,
    /```([A-Za-z0-9_+\-]*)[ \t]*\n([\s\S]*?)\n```/g,
    (_m, lang, content) => {
      lang    = (lang || '').trim();
      content = content.replace(/\n+$/, '');
      if (opts.preserve_code_language && lang) return `{code:${lang}}\n${content}\n{code}`;
      return `{code}\n${content}\n{code}`;
    }
  );
  text = t1; stash.push(...cb);

  // 2. Protect inline code
  let [t2, ic] = protectSegments(
    text,
    /`([^`\n]+)`/gm,
    (_m, code) => `{{${code}}}`
  );
  text = t2; stash.push(...ic);

  // 3. Images
  if (opts.convert_images) {
    text = text.replace(/!\[[^\]]*\]\(([^)]+)\)/g, '!$1!');
  }

  // 4. Links
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '[$1|$2]');

  // 5. Headers (h6 → h1, longest first to avoid partial matches)
  for (let lvl = 6; lvl >= 1; lvl--) {
    text = text.replace(
      new RegExp(`^${'#'.repeat(lvl)}\\s+(.*)$`, 'gm'),
      `h${lvl}. $1`
    );
  }

  // 6. Blockquotes
  if (opts.convert_blockquotes) {
    const lines = text.split('\n');
    const out   = [];
    let buf     = [];

    const flush = () => {
      if (!buf.length) return;
      if (opts.blockquote_multiline) {
        out.push('{quote}', ...buf, '{quote}');
      } else {
        buf.forEach(l => out.push(`{quote}${l}{quote}`));
      }
      buf = [];
    };

    lines.forEach(line => {
      if (/^\s*>\s?/.test(line)) {
        buf.push(line.replace(/^\s*>\s?/, ''));
      } else {
        flush();
        out.push(line);
      }
    });
    flush();
    text = out.join('\n');
  }

  // 7. Tables
  if (opts.convert_tables) {
    const isSep = l => /^\|?[\s:\-]+(\|[\s:\-]+)+\|?$/.test(l.trim());
    const lines = text.split('\n');
    const out   = [];
    let i = 0;

    while (i < lines.length) {
      if (lines[i].includes('|') && i + 1 < lines.length && isSep(lines[i + 1])) {
        const tbl = [lines[i], lines[i + 1]];
        i += 2;
        while (i < lines.length && lines[i].trim() && lines[i].includes('|')) {
          tbl.push(lines[i++]);
        }
        const headers = tbl[0].trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        out.push('|| ' + headers.join(' || ') + ' ||');
        for (const row of tbl.slice(2)) {
          const cells = row.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
          out.push('| ' + cells.join(' | ') + ' |');
        }
        continue;
      }
      out.push(lines[i++]);
    }
    text = out.join('\n');
  }

  // 8. Bold & strikethrough
  text = text.replace(/\*\*(.+?)\*\*/g,  '*$1*');
  text = text.replace(/__(.+?)__/g,       '*$1*');
  text = text.replace(/~~(.+?)~~/g,       '-$1-');

  // 9. Italic *text* (not **text**)
  text = text.replace(/(?<!\*)\*(?!\s)([^*\n]+?)(?<!\s)\*(?!\*)/g, '_$1_');

  // 10. Unordered lists
  text = text.replace(/^(\s*)([-+*])\s+(.*)$/gm, (_m, sp, _b, content) => {
    const level = indentLevelFromSpaces(sp.replace(/\t/g, '    ').length, spi);
    return '*'.repeat(level) + ' ' + content;
  });

  // 11. Ordered lists
  text = text.replace(/^(\s*)\d+\.\s+(.*)$/gm, (_m, sp, content) => {
    const level = indentLevelFromSpaces(sp.replace(/\t/g, '    ').length, spi);
    return '#'.repeat(level) + ' ' + content;
  });

  return restoreSegments(text, stash);
}

// ── Jira → Markdown ─────────────────────────────────

function jiraToMd(text) {
  text = normalizeNewlines(text);
  const stash = [];

  // 1. Protect code blocks
  let [t1, cb] = protectSegments(
    text,
    /\{code(?::([A-Za-z0-9_+\-]+))?\}\n?([\s\S]*?)\n?\{code\}/g,
    (_m, lang, content) => {
      lang    = (lang || '').trim();
      content = (content || '').replace(/\n+$/, '');
      if (lang) return `\`\`\`${lang}\n${content}\n\`\`\``;
      return `\`\`\`\n${content}\n\`\`\``;
    }
  );
  text = t1; stash.push(...cb);

  // 2. Protect inline code
  let [t2, ic] = protectSegments(
    text,
    /\{\{([^}\n]+)\}\}/gm,
    (_m, code) => `\`${code}\``
  );
  text = t2; stash.push(...ic);

  // 3. Quote blocks
  text = text.replace(/\{quote\}\n?([\s\S]*?)\n?\{quote\}/g, (_m, content) => {
    content = content.replace(/^\n+|\n+$/g, '');
    return content.split('\n').map(l => l.trim() ? '> ' + l : '>').join('\n');
  });

  // 4. Headers
  for (let lvl = 6; lvl >= 1; lvl--) {
    text = text.replace(
      new RegExp(`^h${lvl}\\.\\s+(.*)$`, 'gm'),
      '#'.repeat(lvl) + ' $1'
    );
  }

  // 5. Tables
  const isJiraHdr = l => { const s = l.trim(); return s.startsWith('||') && s.endsWith('||'); };
  const isJiraRow = l => { const s = l.trim(); return s.startsWith('|') && s.endsWith('|') && !s.startsWith('||'); };
  {
    const lines = text.split('\n');
    const out   = [];
    let i = 0;

    while (i < lines.length) {
      if (isJiraHdr(lines[i])) {
        const tbl = [lines[i++]];
        while (i < lines.length && isJiraRow(lines[i])) tbl.push(lines[i++]);

        const hcells = tbl[0].trim().replace(/^\|+|\|+$/g, '').split('||').map(c => c.trim()).filter(Boolean);
        out.push('| ' + hcells.join(' | ') + ' |');
        out.push('| ' + hcells.map(() => '---').join(' | ') + ' |');
        for (const row of tbl.slice(1)) {
          const cells = row.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
          out.push('| ' + cells.join(' | ') + ' |');
        }
        continue;
      }
      out.push(lines[i++]);
    }
    text = out.join('\n');
  }

  // 6. Images
  text = text.replace(/!(https?:\/\/[^!\s]+)!/g, '![]($1)');

  // 7. Links
  text = text.replace(/\[([^|\]]+)\|([^\]]+)\]/g, '[$1]($2)');

  // 8. Bold *text* → **text**
  text = text.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '**$1**');

  // 9. Italic _text_ → *text*
  text = text.replace(/(?<!_)_([^_\n]+)_(?!_)/g, '*$1*');

  // 10. Strikethrough -text-
  text = text.replace(/(?<!\w)-([^- \n][^-\n]*?)-(?!\w)/g, '~~$1~~');

  // 11. Unordered lists
  text = text.replace(/^(\*+)\s+(.*)$/gm, (_m, stars, content) =>
    '  '.repeat(stars.length - 1) + '- ' + content
  );

  // 12. Ordered lists
  text = text.replace(/^(#+)\s+(.*)$/gm, (_m, hashes, content) =>
    '  '.repeat(hashes.length - 1) + '1. ' + content
  );

  return restoreSegments(text, stash);
}

//  UI
// ══════════════════════════════════════════════════

const mdEl      = document.getElementById('md-input');
const jiraEl    = document.getElementById('jira-input');
const mdStats   = document.getElementById('md-stats');
const mdLines   = document.getElementById('md-lines');
const jiraStats = document.getElementById('jira-stats');
const jiraLines = document.getElementById('jira-lines');
const toastEl   = document.getElementById('toast');

// ── Settings helpers ─────────────────────────────

function getOpts() {
  return {
    spaces_per_indent:      parseInt(document.getElementById('s-spaces').value)    || 2,
    convert_tables:         document.getElementById('s-tables').checked,
    convert_images:         document.getElementById('s-images').checked,
    convert_blockquotes:    document.getElementById('s-blockquotes').checked,
    preserve_code_language: document.getElementById('s-codelang').checked,
    blockquote_multiline:   document.getElementById('s-multiline').checked,
  };
}

// ── Toast ────────────────────────────────────────

let toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

// ── Char counter ─────────────────────────────────

function updateStats(el, statsEl, linesEl) {
  const v     = el.value;
  const chars = v.length;
  const lines = v ? v.split('\n').length : 0;
  statsEl.textContent = chars === 1 ? '1 caractere' : `${chars.toLocaleString('pt-BR')} caracteres`;
  linesEl.textContent = lines === 1 ? '1 linha'     : `${lines.toLocaleString('pt-BR')} linhas`;
}

// ── Auto-convert (debounced) ─────────────────────

let autoTimer   = null;
let converting  = false;  // prevent echo loop

mdEl.addEventListener('input', () => {
  updateStats(mdEl, mdStats, mdLines);
  if (!document.getElementById('auto-convert').checked || converting) return;
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => {
    converting = true;
    jiraEl.value = mdToJira(mdEl.value, getOpts());
    updateStats(jiraEl, jiraStats, jiraLines);
    converting = false;
  }, 350);
});

jiraEl.addEventListener('input', () => {
  updateStats(jiraEl, jiraStats, jiraLines);
  if (!document.getElementById('auto-convert').checked || converting) return;
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => {
    converting = true;
    mdEl.value = jiraToMd(jiraEl.value);
    updateStats(mdEl, mdStats, mdLines);
    converting = false;
  }, 350);
});

// Focus highlight
mdEl.addEventListener('focus',   () => document.getElementById('panel-md').classList.add('focus-in'));
mdEl.addEventListener('blur',    () => document.getElementById('panel-md').classList.remove('focus-in'));
jiraEl.addEventListener('focus', () => document.getElementById('panel-jira').classList.add('focus-in'));
jiraEl.addEventListener('blur',  () => document.getElementById('panel-jira').classList.remove('focus-in'));

// ── Conversion buttons ───────────────────────────

document.getElementById('btn-md2jira').addEventListener('click', () => {
  jiraEl.value = mdToJira(mdEl.value, getOpts());
  updateStats(jiraEl, jiraStats, jiraLines);
  toast('✓ Convertido: Markdown → Jira');
});

document.getElementById('btn-jira2md').addEventListener('click', () => {
  mdEl.value = jiraToMd(jiraEl.value);
  updateStats(mdEl, mdStats, mdLines);
  toast('✓ Convertido: Jira → Markdown');
});

// ── Swap ─────────────────────────────────────────

document.getElementById('btn-swap').addEventListener('click', () => {
  [mdEl.value, jiraEl.value] = [jiraEl.value, mdEl.value];
  updateStats(mdEl,   mdStats,   mdLines);
  updateStats(jiraEl, jiraStats, jiraLines);
  toast('⇅ Conteúdo trocado');
});

// ── Copy ─────────────────────────────────────────

document.getElementById('btn-copy-md').addEventListener('click', () => {
  navigator.clipboard.writeText(mdEl.value)
    .then(() => toast('📋 Markdown copiado!'))
    .catch(()  => toast('Erro ao copiar'));
});

document.getElementById('btn-copy-jira').addEventListener('click', () => {
  navigator.clipboard.writeText(jiraEl.value)
    .then(() => toast('📋 Jira markup copiado!'))
    .catch(()  => toast('Erro ao copiar'));
});

// ── Clear ────────────────────────────────────────

document.getElementById('btn-clear-md').addEventListener('click', () => {
  mdEl.value = '';
  updateStats(mdEl, mdStats, mdLines);
});
document.getElementById('btn-clear-jira').addEventListener('click', () => {
  jiraEl.value = '';
  updateStats(jiraEl, jiraStats, jiraLines);
});
document.getElementById('btn-clear').addEventListener('click', () => {
  mdEl.value = jiraEl.value = '';
  updateStats(mdEl,   mdStats,   mdLines);
  updateStats(jiraEl, jiraStats, jiraLines);
  toast('🗑 Tudo limpo');
});

// ── Settings panel ───────────────────────────────

document.getElementById('settings-toggle').addEventListener('click', () => {
  document.getElementById('settings-panel').classList.toggle('open');
});

// ── Theme toggle ─────────────────────────────────

const themeBtn = document.getElementById('theme-toggle');
let dark = localStorage.getItem('theme') === 'dark';

function applyTheme() {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : '');
  themeBtn.textContent = dark ? '☀️' : '🌙';
  themeBtn.title       = dark ? 'Modo claro' : 'Modo escuro';
}
applyTheme();

themeBtn.addEventListener('click', () => {
  dark = !dark;
  localStorage.setItem('theme', dark ? 'dark' : 'light');
  applyTheme();
});
