<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown ↔ Jira Converter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ══ HEADER ══════════════════════════════════════════ -->
<header>
  <div class="logo">
    <div class="logo-icon">⇄</div>
    <div class="logo-text">
      <h1>Markdown ↔ Jira</h1>
      <small>Conversor de formatação</small>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn ghost" id="settings-toggle" title="Configurações">
      ⚙ Configurações
    </button>
    <button class="btn ghost icon-only" id="theme-toggle" title="Alternar tema" aria-label="Alternar tema">🌙</button>
  </div>
</header>

<!-- ══ SETTINGS ════════════════════════════════════════ -->
<div id="settings-panel" role="region" aria-label="Configurações">
  <h2>Opções de conversão</h2>
  <div class="settings-grid">
    <div class="setting-row">
      <label for="s-spaces">Espaços por nível de indentação</label>
      <input type="number" id="s-spaces" value="2" min="1" max="8" />
    </div>
    <div class="setting-row">
      <label for="s-tables">Converter tabelas</label>
      <input type="checkbox" id="s-tables" checked />
    </div>
    <div class="setting-row">
      <label for="s-images">Converter imagens</label>
      <input type="checkbox" id="s-images" checked />
    </div>
    <div class="setting-row">
      <label for="s-blockquotes">Converter citações (blockquotes)</label>
      <input type="checkbox" id="s-blockquotes" checked />
    </div>
    <div class="setting-row">
      <label for="s-codelang">Preservar linguagem dos blocos de código</label>
      <input type="checkbox" id="s-codelang" checked />
    </div>
    <div class="setting-row">
      <label for="s-multiline">Citações multilinha com <code>{quote}</code></label>
      <input type="checkbox" id="s-multiline" checked />
    </div>
  </div>
</div>

<!-- ══ TOOLBAR ═════════════════════════════════════════ -->
<div class="toolbar">
  <button class="btn primary" id="btn-md2jira">Markdown → Jira</button>
  <button class="btn primary" id="btn-jira2md">Jira → Markdown</button>
  <div class="toolbar-sep"></div>
  <button class="btn" id="btn-swap" title="Trocar conteúdo dos painéis">⇅ Trocar</button>
  <button class="btn" id="btn-example">📋 Exemplo</button>
  <button class="btn" id="btn-clear">🗑 Limpar</button>
  <label class="auto-row" title="Converte automaticamente enquanto você digita">
    <input type="checkbox" id="auto-convert" />
    Converter automaticamente
  </label>
</div>

<!-- ══ EDITORS ═════════════════════════════════════════ -->
<main>
  <div class="editors">

    <!-- Markdown panel -->
    <div class="panel" id="panel-md">
      <div class="panel-header">
        <div class="panel-title">
          <span>Markdown</span>
          <span class="badge">entrada</span>
        </div>
        <div class="panel-actions">
          <button class="btn sm" id="btn-copy-md">📋 Copiar</button>
          <button class="btn sm" id="btn-clear-md">✕</button>
        </div>
      </div>
      <textarea
        id="md-input"
        spellcheck="false"
        placeholder="Cole ou digite seu Markdown aqui...&#10;&#10;Use os botões acima para converter."
      ></textarea>
      <div class="panel-footer">
        <span id="md-stats">0 caracteres</span>
        <span id="md-lines">0 linhas</span>
      </div>
    </div>

    <!-- Jira panel -->
    <div class="panel" id="panel-jira">
      <div class="panel-header">
        <div class="panel-title">
          <span>Jira Wiki Markup</span>
          <span class="badge">saída</span>
        </div>
        <div class="panel-actions">
          <button class="btn sm" id="btn-copy-jira">📋 Copiar</button>
          <button class="btn sm" id="btn-clear-jira">✕</button>
        </div>
      </div>
      <textarea
        id="jira-input"
        spellcheck="false"
        placeholder="Cole ou digite seu Jira markup aqui...&#10;&#10;Use os botões acima para converter."
      ></textarea>
      <div class="panel-footer">
        <span id="jira-stats">0 caracteres</span>
        <span id="jira-lines">0 linhas</span>
      </div>
    </div>
  </div>
</main>

<!-- ══ FOOTER ══════════════════════════════════════════ -->
<footer>
  Baseado em <a href="https://github.com/crqcastro/markdown_to_jira" target="_blank" rel="noopener">MarkdownJiraConverter</a>
  por <a href="https://github.com/crqcastro" target="_blank" rel="noopener">crqcastro</a>
  &middot; Licença MIT
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<script src="converter.js"></script>
</body>
</html>
